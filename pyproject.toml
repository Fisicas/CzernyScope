[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrometer-live"
version = "0.4.0"
description = "CzernyScope live spectrum acquisition for Maya2000 Pro and USB650 on Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "matplotlib==3.11.2",
    "PySide6==6.11.2",
]

[project.optional-dependencies]
hardware = [
    "seabreeze==2.11.0",
    "pyusb==1.3.1",
    "libusb-package==1.0.30.1",
]

[project.gui-scripts]
czernyscope = "spectrometer_app.__main__:main"
spectrometer-live = "spectrometer_app.__main__:main"

[tool.setuptools.packages.find]
include = ["spectrometer_app*"]

[tool.setuptools.package-data]
spectrometer_app = ["assets/spectrometer-live.ico"]
