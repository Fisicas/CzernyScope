name: Build Windows packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
      - name: Prepare the isolated build environment
        run: |
          python -m venv .venv-build
          .\.venv-build\Scripts\python.exe -m pip install ".[hardware]" -r requirements-build.txt pytest==9.1.1
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv-build\Scripts\python.exe -X utf8 -m pytest -q -p no:cacheprovider --basetemp "$env:RUNNER_TEMP\cz-tests"
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $installer
          $expectedHash = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'The Inno Setup download did not match its published SHA-256.'
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo('SimpleName', $false) -ne 'Pyrsys B.V.') {
            throw 'The Inno Setup download did not have the expected valid publisher signature.'
          }
          $setup = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES', '/ALLUSERS' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup install failed ($($setup.ExitCode))." }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'ISCC.exe is missing.' }
          "ISCC_PATH=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows release candidate
        shell: pwsh
        run: |
          $buildArgs = @('--output', 'dist/release', '--iscc', $env:ISCC_PATH)
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $buildArgs += @('--tag', $env:GITHUB_REF_NAME)
          } else {
            $buildArgs += '--allow-local'
          }
          .\.venv-build\Scripts\python.exe -X utf8 tools/build_release.py @buildArgs
      - uses: actions/upload-artifact@v7
        with:
          name: CzernyScope-windows-packages
          path: dist/release/packages/
          if-no-files-found: error
          compression-level: 0
